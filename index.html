<style>

.sky{background:linear-gradient(#8fd3ff,#d6f0ff);border-radius:14px 14px 0 0;height:90px;position:relative;font-size:34px;overflow:hidden}

.land{padding:12px 8px;background:repeating-linear-gradient(#5fae3a 0 30px,#58a335 30px 60px)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{background:#9b6a35;border:3px dashed #5a3a1a;border-radius:12px;min-height:130px;text-align:center;padding:4px;font-size:11px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer}
.slot.f{border-style:solid;background:#7a5226}
.bush{font-size:44px;line-height:1;transition:.3s}
.m-Mini .bush{font-size:26px}.m-Bigbig .bush{font-size:64px}
.m-Radioactive .bush{filter:drop-shadow(0 0 8px #3f3) hue-rotate(40deg)}
.m-Frozen .bush{filter:hue-rotate(120deg) saturate(.6) brightness(1.4) drop-shadow(0 0 6px #aef)}
.m-NPC .bush{filter:grayscale(1)}.m-NPC .bush:after{content:"👀";font-size:16px}
.m-Concentrated .bush{filter:drop-shadow(0 0 10px #ff0) brightness(1.2);animation:pul 1s infinite}
.m-NICHER .bush{animation:pul .6s infinite,rb 2s linear infinite}
.m-Dada .bush{filter:sepia(1) hue-rotate(-30deg)}.m-Cagado .bush{filter:sepia(1) brightness(.6)}
.m-Piece .bush{filter:hue-rotate(60deg)}
@keyframes pul{50%{transform:scale(1.2)}}@keyframes rb{to{filter:hue-rotate(360deg) drop-shadow(0 0 12px #f0f)}}
.barn{text-align:center;font-size:50px;margin-top:6px}
.btn{background:#f2b134;border:0;border-bottom:4px solid #b57a0c;border-radius:10px;padding:8px 14px;font-weight:bold;color:#3b2a14;cursor:pointer;margin:2px}
.btn:active{transform:translateY(2px)}.btn:disabled{background:#bbb;border-color:#888}
.btn.r{background:#e8553d;border-color:#9b2a1a;color:#fff}.btn.g{background:#6cc24a;border-color:#3b7d22}
#roll{display:block;margin:20px auto;font-size:34px;padding:22px 60px;border-radius:20px}
.card{background:#fff8e1;border:3px solid #8b5a2b;border-radius:12px;padding:8px;font-size:12px;box-shadow:0 3px 0 #5a3a1a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.panel{background:#fff8e1cc;border:3px solid #8b5a2b;border-radius:12px;padding:10px;margin:8px 0}
h2,h3{margin:6px 0}
.Common{--c:#9aa}.Uncommon{--c:#4c4}.Rare{--c:#38f}.Epic{--c:#a4e}.Legendary{--c:#fb0}.Mythic{--c:#f33}.Secret{--c:#111}
.rc{color:var(--c);font-weight:bold}.rc.s3{text-shadow:0 0 5px var(--c)}.rc.s4{text-shadow:0 0 6px var(--c),0 0 12px var(--c);letter-spacing:1px}.card.rr,.slot.rr{border-color:var(--c)}
.bar{background:#ccc;border-radius:6px;height:8px;overflow:hidden}.bar i{display:block;height:100%;background:#6cc24a}
#ov{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:center;justify-content:center;padding:14px}
#ov .box{background:#fff8e1;border:5px solid #8b5a2b;border-radius:16px;padding:16px;max-width:360px;width:100%;text-align:center;animation:pop .4s}
@keyframes pop{from{transform:scale(.3) rotate(-8deg)}to{transform:none}}
.fx-Mythic .box{box-shadow:0 0 40px #f33;animation:pop .4s,shk .5s}.fx-Secret .box{box-shadow:0 0 60px #000;animation:pop .6s,shk .8s;background:#222;color:#fff}
.fx-NICHER .box{animation:pop .6s,shk 1s,bg 1s linear infinite}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}}
@keyframes bg{to{filter:hue-rotate(360deg)}}
.noanim *{animation:none!important;transition:none!important}
td,th{padding:3px 8px;text-align:left}
@media(max-width:600px){.slot{min-height:100px;font-size:9px}.bush{font-size:32px}.m-Bigbig .bush{font-size:44px}#hud{font-size:11px}#roll{padding:18px 40px}#nav button{font-size:9px}}

.t{position:absolute;line-height:1;pointer-events:none}

.barn2 i{position:absolute;left:-9px;top:-33px;border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:30px solid #6b2a14}
.barn2 b{display:block;font-size:26px;line-height:50px}
.fx-multi .box{animation:pop .4s,shk .6s;box-shadow:0 0 40px #f0f}
.k-gold .box{background:linear-gradient(#fff3b0,#ffd23f);box-shadow:0 0 50px gold}
.k-dia .box{background:linear-gradient(#e0f7ff,#6cc8ff);box-shadow:0 0 50px #4cf}
.k-obs .box{background:#1a0f26;color:#d9b3ff;box-shadow:0 0 70px #70f;animation:pop .8s,shk 1s}
#toast{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:6px 12px;border-radius:10px;z-index:30;display:none;font-size:12px;text-align:center}
@media(max-width:600px){.sl{font-size:8px;min-width:52px}.sl .bush{font-size:22px}.farm2{height:420px}}
.farm2{background:#5fae3a;isolation:isolate}
#main{position:relative;z-index:1}#hud{z-index:10}#nav{z-index:10}
svg.sc{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sl,.sl.f{background:none;border:0;box-shadow:none;padding:0;z-index:3;width:15%;min-width:56px;transform:translate(-50%,-62%)}
.sl .bush{font-size:38px;filter:drop-shadow(0 2px 1px #0003)}
.sh{width:56px;height:15px;border-radius:50%;background:radial-gradient(#5e3b1b 35%,#8d6234 70%,#8d623300);margin:-12px auto 2px}
.lb{display:inline-block;max-width:100%;font-size:10px;line-height:1.2;background:#fff8e1;color:#3b2a14;border:2px solid var(--c,#8b5a2b);border-radius:8px;padding:1px 4px;box-shadow:0 2px 3px #0004}

.Eternal{--c:#00e5ff}.Divino{--c:#ff5ec8}

.m-massapura .bush{filter:contrast(1.4) sepia(.6)}.m-juicy .bush{filter:saturate(2.2) drop-shadow(0 0 6px #f6a)}.m-inverted .bush{filter:invert(1)}.m-HORNY .bush{filter:hue-rotate(300deg) drop-shadow(0 0 6px red)}.m-zaponeje .bush{filter:hue-rotate(200deg) saturate(2)}.m-estevonico .bush{filter:grayscale(1) contrast(1.6)}.m-broxa .bush{filter:grayscale(.7) brightness(.8)}.m-doctor .bush{filter:brightness(1.4) drop-shadow(0 0 6px #fff)}
.fx-Epic .box{box-shadow:0 0 20px #a4e}.fx-Legendary .box{box-shadow:0 0 35px gold}

   · SHP_P  = preço de referência de uma carta subtipo I (raridade). Ancorado no requisito de Rebirth (1e6×10^reb) do estágio em que a raridade
              começa a aparecer: Common/Uncommon = trocados; Rare ≈ 5% do 1º Rebirth; Epic ≈ 20% do Rebirth 2; Legendary ≈ 40% do Rebirth ~3–4;
              Mythic ≈ 55% do Rebirth ~5–6; Secret ≈ 1× o Rebirth ~8; Eternal ≈ 3× o ~11; Divino ≈ 8× o ~15. A fração cresce com a raridade,
              então o salto entre raridades é cada vez maior (×15, ×20, ×33, ×60, ×167, ×750, ×2.000, ×25.000...).
   · A razão baseBps ÷ (RBASE × SUBM) mantém só a variação individual de força da Bush (±15%).
   · SUBP = prêmio de subtipo (força + dificuldade de sair, SUBW): I 1× · II 1,6× · III 2,8× · IV 5× · V 9×.

const UQ={};

const upCostAt=(k,L)=>Math.floor(UP[k][2]*Math.pow(UP[k][3],L));

 while(n<want&&L+n<cap&&n<1e5){const c=upCostAt(k,L+n);if(!isFinite(c)||tot+c>S.money)break;tot+=c;n++}
 return{L,n,tot,end:L+n,cap,next:L+n<cap?upCostAt(k,L+n):null,want}}
function upBox(k){const w=UQ[k]||1,p=upPlan(k,w);
 if(p.L>=p.cap)return`<div class="stats4"><div class="stat"><small>Nível</small><b>${p.L} (MAX)</b></div></div><button class="btn wide" disabled>NÍVEL MÁXIMO</button>`;

 return`<div class="stats4 up3"><div class="stat"><small>Atual</small><b>${p.L}</b></div><div class="stat"><small>Qtd</small><b>${p.n>0?p.n:0}</b></div><div class="stat"><small>Final</small><b>${p.end}</b></div></div>`
 +(p.n>0&&p.n<w?`<small class="upn">Máximo que você consegue pagar agora</small>`:"")
 +`<button class="btn g wide" ${p.n<1?"disabled":""} onclick="buyUp('${k}')">${p.n>0?"COMPRAR "+p.n+" · ":"Próx. nível · "}🪙 ${f(cost)}</button>`}

<div class="qty sm"><button onclick="upStep('${k}',-1)" aria-label="Diminuir">−</button><input id="upq_${k}" type="number" min="1" inputmode="numeric" value="${UQ[k]||1}" oninput="upSet('${k}',this.value)"><button onclick="upStep('${k}',1)" aria-label="Aumentar">+</button></div>
<div class="chips"><button class="chipb" onclick="upSet('${k}',1,1)">1</button><button class="chipb" onclick="upSet('${k}',10,1)">10</button><button class="chipb" onclick="upSet('${k}',100,1)">100</button><button class="chipb" onclick="upSet('${k}',1e5,1)">MAX</button></div>

// BOSSP[r] = "poder-alvo" do time (HP de cada Bush ÷ baseBps do Boss) para vencer o Boss da raridade r por pouco.
// Cresce ~32% por raridade (Common 90 → Celestial 1100). Referência de 1 Bush: Qualidade × nível (até ×12,1 no Lv200) × Gema (até ~×3 a ×6,7) × habilidade × bônus de armadura/títulos.
// Ex. Celestial (1100): 3 Big Bush Q:A–S, Lv 200, Gema 100, boa habilidade e armadura => vitória apertada (perde 1–2 Bushes). Times medianos perdem; times máximos (Q alta + mutações) vencem com dificuldade.
const BOSSP=[90,120,155,205,275,360,475,630,830,1100],BOSSHK=4.6,BOSSDK=.1;
const BOSSD=["Difícil","Difícil","Muito difícil","Muito difícil","Brutal","Brutal","Infernal","Infernal","Apocalíptica","Cataclísmica"];
// A sub-raridade (I–V) influencia o Boss pela raiz do multiplicador (V ≈ ×2,2 de I, e não ×5) para nenhum Boss ficar impossível. O Celestial (Big Bush) usa o BPS base fixo.
const bossRef=b=>Math.max(1,b.rarity>=9?b.baseBps:b.baseBps/Math.sqrt(SUBM[b.sub||0]));
const pieceName=b=>{const n=b.name.replace(/\s*bush\s*$/i,"").trim()||b.name;return n.charAt(0).toUpperCase()+n.slice(1)+" Piece"};
const evoName=b=>(b.name.charAt(0).toUpperCase()+b.name.slice(1)).replace(/bush/ig,"Bush")+" Evoluído";
const bossStats=b=>{const P=BOSSP[Math.min(9,b.rarity)],ref=bossRef(b);return{n:b.name,em:"👑",hp:ref*P*BOSSHK,dm:ref*P*BOSSDK}};
function chkWar(){const id=Math.floor(Date.now()/WSLOT);if(!S.war||S.war.id<id)S.war={id,rar:-1,boss:null,won:false,tries:0,log:""}}
function warVote(r){chkWar();if(S.war.rar>=0)return toast("Você já votou nesta Guerra",2000);
 const p=B.filter(b=>b.rarity==r);if(!p.length)return toast("Ainda não existem Bushes "+WRAR[r],2500);
 const b=p[Math.floor(Math.random()*p.length)];S.war.rar=r;S.war.boss=b.id;S.war.log="";beep(SND.get);toast("⚔ Boss: "+b.name,2500);render()}
function wadd(k){if(S.wteam.length<3&&!S.wteam.includes(k)&&S.inv[k])S.wteam.push(k);render()}
function wrem(k){S.wteam=S.wteam.filter(x=>x!=k);render()}
function wfight(){chkWar();const w=S.war;if(w.rar<0||w.won)return;S.wteam=S.wteam.filter(k=>S.inv[k]);if(S.wteam.length<3)return;
 if(Date.now()<Math.min(S.wcd||0,Date.now()+TCD))return;S.wcd=Date.now()+TCD;
 const bs=bush(w.boss),r=fight(0,[bossStats(bs)],S.wteam);w.tries++;
 let h=`<h3>${r.win?"✅ VITÓRIA":"❌ DERROTA"} (${r.t} turnos)</h3>`+r.T.map(x=>`${bush(x.i.id).name}: ❤ ${f(Math.max(0,x.hp))}/${f(x.mx)}`).join("<br>")+"<br>"+r.E.map(e=>`${e.em} ${e.n}: ❤ ${f(Math.max(0,e.hp))}/${f(e.mx)}`).join("<br>");
 if(r.win){w.won=true;S.wwins++;h+=`<br><b>Recompensa:</b><br>`+warRewards(bs.rarity,bs.id).join("<br>")+`<br><small>Suas Bushes não foram perdidas.</small>`;beep(SND.lvl)}
 else h+=`<br><b>Derrota!</b> Suas Bushes não foram perdidas — tente outro time.`;
 w.log=h;save();render()}
const PCN=3,hasB=id=>Object.values(S.inv).some(i=>i.id==id&&!i.evo);
function evoOpen(id){const b=bush(id);if(!b)return;if((S.pieces[id]||0)<PCN)return toast("Faltam Pieces para evoluir",2500);const c=Object.values(S.inv).filter(i=>i.id==id&&!i.evo).sort(SORT[0]);
 if(!c.length)return toast("Você precisa possuir a "+b.name+" para evoluí-la. Pieces sozinhas não criam uma Bush.",3500);
 modal(`<h3>✦ Evoluir ${b.name}</h3>1× ${b.name} + ${PCN}× ${pieceName(b)} → <b>${evoName(b)}</b><br><small>Transcendência da Bush escolhida: BPS ×3 · mantém nível, XP, mutações, tier, Gema e equipamento</small><p><select id="evsel" style="width:100%">${c.map(i=>`<option value="${i.k}">${Q[i.q].n} · Lv ${i.lv} · ${i.t>=0?TIERS[i.t].n+" · ":""}${i.ms.map(k=>M[k].n).join("+")||"sem mutação"} · ${f(bushBps(i))} → ${f(bushBps(i)*3)} BPS${S.eq.includes(i.k)?" (equipada)":""}</option>`).join("")}</select></p>`,
 [["CANCEL","",()=>{}],["EVOLUIR","g",()=>evoGo(id,document.getElementById("evsel").value)]])}
function evoGo(id,key){if((S.pieces[id]||0)<PCN)return;const i=S.inv[key];if(!i||i.id!=id||i.evo)return;
 S.pieces[id]-=PCN;i.evo=1;S.bevo[id]=1;S.bb[id]=Math.max(S.bb[id]||0,bushBps(i));beep(SND.reb);
 const b=bush(id);toast("✦ "+evoName(b)+"!",3000);modal(`<h2>✦ EVOLUÍDA!</h2><div class="card rr ${RAR[b.rarity]}">${bcard(i)}</div>`,[["OK","g",()=>render()]])}
const WAR_OLD=()=>{chkWar();const w=S.war;S.wteam=S.wteam.filter(k=>S.inv[k]);const T=S.wteam.map(k=>S.inv[k]),boss=w.boss?bush(w.boss):null,bs=boss?bossStats(boss):null,cdl=Math.max(0,(S.wcd||0)-Date.now());
 const pcs=Object.keys(S.pieces).filter(id=>S.pieces[id]>0&&bush(id));
 return`<div class="panel war-head"><div><h2>⚔ GUERRA DE BUSHES</h2><small>Conteúdo de ENDGAME · nova Guerra a cada 10 minutos · vença o Boss: Piece, War Tokens, Pet Coins e mais (quanto maior a raridade, melhor)</small></div><div class="cs-timer"><small>Nova Guerra em</small><b id="wT">${tm(((w.id+1)*WSLOT-Date.now())/1000)}</b></div></div>
<div class="panel"><h2>🗳 Votar raridade do Boss</h2><div class="chips">${WRAR.map((r,k)=>{const n=WRAR_COUNT(k);return`<button class="chipb ${r} ${w.rar==k?"on":""}" ${w.rar>=0||!n?"disabled":""} onclick="warVote(${k})">${r}<small>${n?n+" Bushes":"sem Bushes"}</small></button>`}).join("")}</div>${w.rar<0?"<small>O voto vale para esta Guerra e sorteia um Boss da raridade escolhida.</small>":""}</div>
${WARREW()}
${boss?`<div class="panel"><h2>👑 Boss</h2><div class="boss-row"><div class="art ${RAR[boss.rarity]}" style="width:120px"><div class="bush">${bi(boss)}</div></div><div><b style="font-size:16px">${boss.name}</b><br><span class="rc s${boss.sub||0} ${RAR[boss.rarity]}">${RAR[boss.rarity]} ${SUBN[boss.sub||0]}</span><br>☠ Dificuldade: <b>${BOSSD[Math.min(9,boss.rarity)]}</b><br>❤ ${f(bs.hp)} · ⚔ ${f(bs.dm)}<br>Peça: <b>🧩 ${pieceName(boss)}</b> <small>(${S.pieces[boss.id]||0}/3)</small><br>${w.won?"<b style='color:var(--ok)'>✅ Guerra vencida!</b>":"Tentativas: "+w.tries}</div></div></div>`:""}
<div class="panel"><h2>Seu time (${T.length}/3)</h2><div class="grid">${T.map(i=>{const b=bush(i.id),c=cs(i);return`<div class="card rr ${RAR[b.rarity]}" style="text-align:center">${bcard(i)}<br>❤ ${f(c.hp)} · ⚔ ${f(c.dm)}<br>Lv ${i.lv}<br><button class="btn" onclick="wrem('${i.k}')">Remover</button></div>`}).join("")}</div>
<button id="wbtn" class="btn g wide" ${w.rar<0||w.won||T.length<3||cdl>0?"disabled":""} onclick="wfight()">${w.rar<0?"VOTE UMA RARIDADE":w.won?"GUERRA CONCLUÍDA":T.length<3?"ESCOLHA 3 BUSHES":cdl>0?"AGUARDE "+Math.ceil(cdl/1000)+"s":"⚔ LUTAR CONTRA O BOSS"}</button>
${w.log?`<div class="card" style="margin-top:8px;text-align:left">${w.log}</div>`:""}</div>
${ABPANEL()}<div class="panel"><h2>🧩 Suas Pieces</h2><small>Para evoluir: a Bush original + ${PCN} Pieces dela. Só as Pieces não criam uma Bush. BPS ×3.</small>${pcs.map(id=>{const b=bush(id),n=S.pieces[id];return`<div class="row">${bi(b)} <b>${pieceName(b)}</b> <span class="chip">${n}/${PCN}</span><span class="chip ${hasB(id)?"evo":""}">${hasB(id)?"Bush original ✔":"Falta a Bush original ✘"}</span><div class="bar" style="flex:1 1 80px"><i style="width:${Math.min(100,n/PCN*100)}%"></i></div><button class="btn g" ${n<PCN||!hasB(id)?"disabled":""} onclick="evoOpen('${id}')">✦ EVOLUIR → ${evoName(b)}</button></div>`}).join("")||"<div>Nenhuma Piece ainda. Vença uma Guerra!</div>"}</div>
<div class="panel"><h2>Escolher time</h2>${Object.values(S.inv).sort(SORT[0]).map(i=>{const b=bush(i.id),c=cs(i);return`<div class="row">${bi(b)} ${b.name}${i.evo?" ✦":""} · ${Q[i.q].n} · Lv${i.lv} · ❤${f(c.hp)} ⚔${f(c.dm)} <button class="btn" ${S.wteam.includes(i.k)||S.wteam.length>=3?"disabled":""} onclick="wadd('${i.k}')">+ Time</button></div>`}).join("")||"Sem Bushes."}</div>`};

// ===== LOJA DE CARTAS (refresh exato a cada 1h, alinhado ao relógio) =====
const CSLOT=36e5,CS_N=25,csPrice=b=>Math.max(500,shopPrice(b));
function csGen(slot){const W=[30,26,20,12,7,3,1.2,.4,.12],ids=[];let g=0;
 while(ids.length<CS_N&&g++<5000){const r=pick(W),p=B.filter(b=>b.rarity==r&&!ids.includes(b.id));if(!p.length)continue;ids.push(p[Math.floor(Math.random()*p.length)].id)}
 ids.sort((a,b)=>bush(a).rarity-bush(b).rarity||bush(a).baseBps-bush(b).baseBps);S.cs=ids;S.csSlot=slot;save()}
function chkCS(){const slot=Math.floor(Date.now()/CSLOT);if(!Array.isArray(S.cs)||S.csSlot<slot)csGen(slot)}
function buyCS(id){chkCS();if(!S.cs.includes(id))return;const b=bush(id),p=csPrice(b);if(S.money<p)return;if(invFull())return invMsg();
 S.money-=p;giveInst(id,pickQ());S.cs=S.cs.filter(x=>x!=id);beep(SND.get);toast("Comprou "+b.name,2500);render()}
const CARDSHOP=()=>{chkCS();const n=Date.now(),left=((S.csSlot+1)*CSLOT-n)/1000;
 return`<div class="panel war-head"><div><h2>🃏 LOJA DE CARTAS</h2><small>Estoque renova a cada 1 hora · ${S.cs.length}/${CS_N} cartas disponíveis</small></div><div class="cs-timer"><small>Próximo refresh</small><b id="csT">${tm(left)}</b></div></div>
<div class="bar"><i id="csB" style="width:${Math.max(0,Math.min(100,100-left/3600*100))}%"></i></div>
${S.cs.length?`<div class="grid cs-grid">${S.cs.map(id=>{const b=bush(id),p=csPrice(b);return`<div class="card rr cs ${RAR[b.rarity]}"><div class="cs-rib">${RAR[b.rarity]}</div><div class="art"><div class="bush">${bi(b)}</div></div><b class="cs-name">${b.name}</b><div class="rc s${b.sub||0} ${RAR[b.rarity]}">${RAR[b.rarity]} ${SUBN[b.sub||0]}</div><small>BPS base ${f(b.baseBps)}</small><button class="btn g wide" ${S.money<p?"disabled":""} onclick="buyCS('${id}')">🪙 ${f(p)}</button></div>`}).join("")}</div>`
 :`<div class="panel" style="text-align:center"><div style="font-size:42px">🛒</div><h2 style="border:0;padding:0">Loja vazia</h2>Você comprou todas as cartas! Novo estoque no próximo refresh.</div>`}`};
setInterval(()=>{const n=Date.now();
 if(tab=="war"&&S.war){if(Math.floor(n/WSLOT)>S.war.id)return render();const e=$("#wT");if(e)e.textContent=tm(((S.war.id+1)*WSLOT-n)/1000);
  const b=$("#wbtn");if(b&&b.textContent.startsWith("AGUARDE")&&n>=(S.wcd||0))render()}
 if(tab=="cards"&&Array.isArray(S.cs)){if(Math.floor(n/CSLOT)>S.csSlot)return render();const l=((S.csSlot+1)*CSLOT-n)/1000,e=$("#csT");if(e)e.textContent=tm(l);const b=$("#csB");if(b)b.style.width=Math.max(0,Math.min(100,100-l/3600*100))+"%"}
},500);

// ===== POÇÕES EM LOTE (mesmo seletor dos upgrades) =====
const PQS={b:{},u:{}},POTMIN=6e4;
function potPlan(k,m,want){want=Math.max(1,Math.floor(want)||1);const pr=POT[k][1];let mx=m=="b"?Math.floor(S.money/pr):S.pinv[k];mx=Math.max(0,isFinite(mx)?mx:1e9);let n=Math.min(want,mx,1e9);if(m=="b")while(n>0&&n*pr>S.money)n--;return{n,mx,want,pr,tot:n*pr,stock:S.pinv[k],end:m=="b"?S.pinv[k]+n:S.pinv[k]-n}}
function potBox(k,m){const w=PQS[m][k]||1,p=potPlan(k,m,w),L=m=="b"?["Estoque","Comprar","Final"]:["Estoque","Usar","Final"];
 return`<div class="stats4 up3"><div class="stat"><small>${L[0]}</small><b>${f(p.stock)}</b></div><div class="stat"><small>${L[1]}</small><b>${f(p.n)}</b></div><div class="stat"><small>${L[2]}</small><b>${f(p.end)}</b></div></div>`
 +(p.n>0&&p.n<w?`<small class="upn">${m=="b"?"Máximo que você consegue pagar agora":"Máximo em estoque"}</small>`:"")
 +`<small class="upn">${p.n>0?"Duração: +"+tm(p.n*POTMIN/1000):"Duração: +1:00 por poção"}</small>`
 +`<button class="btn g wide" ${p.n<1?"disabled":""} onclick="${m=="b"?"buyPot":"usePot"}('${k}')">${m=="b"?(p.n>0?"COMPRAR "+f(p.n)+" · 🪙 "+f(p.tot):"Sem saldo · 🪙 "+f(p.pr)):(p.n>0?"ATIVAR "+f(p.n):"SEM ESTOQUE")}</button>`}
function potCard(k,m){const P=POT[k],id=m+"_"+k,sub=m=="b"?`🪙 ${f(P[1])} cada · +1:00 por poção`:`Ativa: <span id="pt_${k}">${potA(k)?tm((S.pot[k]-Date.now())/1000):"inativa"}</span> · +1:00 por poção usada`;
 return`<div class="card up-card"><b>${P[0]}</b> <span class="chip">x${f(S.pinv[k])}</span><br><small>${sub}</small>
<div class="qty sm"><button onclick="potStep('${k}','${m}',-1)" aria-label="Diminuir">−</button><input id="pq_${id}" type="number" min="1" inputmode="numeric" value="${PQS[m][k]||1}" oninput="potSet('${k}','${m}',this.value)"><button onclick="potStep('${k}','${m}',1)" aria-label="Aumentar">+</button></div>
<div class="chips"><button class="chipb" onclick="potSet('${k}','${m}',1,1)">1</button><button class="chipb" onclick="potSet('${k}','${m}',10,1)">10</button><button class="chipb" onclick="potSet('${k}','${m}',100,1)">100</button><button class="chipb" onclick="potSet('${k}','${m}',1e9,1)">MAX</button></div>
<div id="pb_${id}">${potBox(k,m)}</div></div>`}
function potRefresh(k,m){const e=$("#pb_"+m+"_"+k);if(e)e.innerHTML=potBox(k,m)}
function potSet(k,m,v,sync){v=Math.floor(+v);if(!(v>=1)){if(sync)v=1;else return}
 if(v>=1e9&&sync){v=Math.max(1,potPlan(k,m,1e9).n)}
 PQS[m][k]=v;if(sync){const i=$("#pq_"+m+"_"+k);if(i)i.value=v}potRefresh(k,m)}
function potStep(k,m,d){const p=potPlan(k,m,PQS[m][k]||1),base=Math.max(1,p.n||1);potSet(k,m,Math.max(1,Math.min(base+d,Math.max(1,p.mx))),1)}

// ===== GEMAS: total 1→100 =====
const GEMTOT=(()=>{let t=0;for(let n=1;n<=GEM_MAX;n++)t+=gemCost(n);return t})();

// ===== CELESTIAL: forja do Big Bush =====
const celCand=id=>Object.values(S.inv).filter(i=>i.id==id&&!S.lock[i.k]).sort((a,b)=>bushBps(a)-bushBps(b));
let celSel={};
function celFix(){DIV_ORIG.forEach(id=>{const c=celCand(id);if(!c.some(i=>i.k==celSel[id]))celSel[id]=(c.find(i=>!S.eq.includes(i.k))||c[0]||{}).k||null})}
function celPick(id,k){celSel[id]=k;render()}
// só aceita os 5 Divinos originais (ids em DIV_ORIG); Divinos fundidos têm id "f..." e são rejeitados
function celSet(){return DIV_ORIG.map(id=>{const i=S.inv[celSel[id]],b=bush(id);return i&&i.id==id&&!b.fused&&!S.lock[i.k]?i:null})}
const celQ=sel=>Math.round(sel.reduce((a,i)=>a+i.q,0)/sel.length);
function CELPANEL(){celFix();const sel=celSet(),ok=sel.every(x=>x),q=ok?celQ(sel):0,big=bush("celBig");
 return`<div class="panel"><h2>🌌 CELESTIAL — FORJAR BIG BUSH</h2><small>Consome 1 de cada um dos 5 Divinos originais e cria o <b>Big Bush</b> (Celestial). Divinos fundidos não são aceitos. Bushes 🔒 não aparecem na lista.</small>
${DIV_ORIG.map(id=>{const b=bush(id),c=celCand(id),tot=Object.values(S.inv).filter(i=>i.id==id).length;return`<div class="row">${bi(b)} <b>${b.name}</b> <span class="chip">tem ${tot}</span>${c.length?`<select onchange="celPick('${id}',this.value)">${c.map(i=>`<option value="${i.k}" ${celSel[id]==i.k?"selected":""}>${S.eq.includes(i.k)?"⭐ ":""}${Q[i.q].n} · Lv${i.lv} · ${i.ms.map(j=>M[j].n).join("+")||"sem mutação"}${i.evo?" ✦":""} · ${f(bushBps(i))} BPS</option>`).join("")}</select>`:`<span style="color:#f2785f">❌ ${tot?"todos bloqueados 🔒":"você não tem"}</span>`}</div>`}).join("")}
<div class="row">${bi(big)} <b>${big.name}</b> <span class="rc ${RAR[big.rarity]}">${RAR[big.rarity]}</span>${ok?` · Qualidade ${Q[q].n} (média) · ${f(big.baseBps*Q[q].m)} BPS`:" · escolha os 5 Divinos"}</div>
<button class="btn g wide" ${ok?"":"disabled"} onclick="celForge()">🌌 FORJAR BIG BUSH</button></div>`}
function celForge(){const sel=celSet();if(!sel.every(x=>x))return;const warn=sel.some(i=>i.evo||i.gem>0||i.lv>1||S.eq.includes(i.k));
 modal(`<h3>🌌 Forjar Big Bush?</h3>Serão consumidos:<br>${sel.map(i=>`${bush(i.id).name} (${Q[i.q].n}, Lv${i.lv}${i.evo?", ✦ evoluído":""}${i.gem?", 💠"+i.gem:""}${S.eq.includes(i.k)?", equipado":""})`).join("<br>")}${warn?"<br><b>⚠ Nível, Gemas, evolução e equipamento desses Bushes serão perdidos.</b>":""}`,[["CANCEL","",()=>{}],["FORJAR","g",celGo]])}
function celGo(){const sel=celSet();if(!sel.every(x=>x))return;const q=celQ(sel);sel.forEach(i=>delete S.inv[i.k]);S.eq=S.eq.map(k=>S.inv[k]?k:null);S.team=S.team.filter(k=>S.inv[k]);S.wteam=S.wteam.filter(k=>S.inv[k]);celSel={};
 const k=giveInst("celBig",q,[]);beep(SND.reb);modal(`<h2>🌌 CELESTIAL!</h2><div class="card rr ${RAR[9]}" style="background:inherit;color:inherit">${bcard(S.inv[k])}</div>`,[["OK","g",()=>render()]])}

<div class="lab">Quantidade de fusões</div><div class="fm-q"><div class="qty sm"><button onclick="fmStep(-1)" aria-label="Diminuir">−</button><input id="fm_q" type="number" min="1" inputmode="numeric" value="${n}" oninput="fmSet(this.value)"><button onclick="fmStep(1)" aria-label="Aumentar">+</button></div><button class="btn fm-max" ${mx>=1?"":"disabled"} onclick="fmSet(${Math.max(1,mx)},1)">MÁX (${f(mx)})</button></div>
<div class="fm-sum">${kp7("Custo total",f(tot)+" "+(k=="ing"?ING[t][0]:RAR[t]),ok?"restam "+f(after):"faltam "+f(tot-have),ok?"good":"bad")}${kp7("Você receberá","+"+f(n)+" "+(k=="ing"?ING[t+1][0]:RAR[t+1]),"total após: "+f((A[t+1]||0)+n),"good")}</div>

<div id="arb_${p}">${arBox(p)}</div>
<div class="lab">Suas peças (${mine.length})</div>${arSelBar(p,mine)}${mine.map(it=>{const e=S.arEq[it.p]==it.k;if(ARSM[p])return arSelRow(it,e);return`<div class="row">${aTag(it.t)} <b>Nível ${ALN[it.l]}</b><span class="chip">${benTxt(apv(it.p,it.t,it.l))}</span>${e?'<span class="chip evo">equipada</span>':""}<button class="btn ${e?"r":"g"}" style="margin-left:auto" onclick="arEquip('${it.k}')">${e?"REMOVER":"EQUIPAR"}</button><button class="btn" onclick="arBreak('${it.k}')">Desmontar</button><button class="btn g" onclick="arSell('${it.k}')">💰 Vender · 🪙 ${f(arSellVal(it))}</button></div>`}).join("")||'<small class="hint">Nenhuma peça deste tipo ainda.</small>'}</section>`}).join("")};

${q.l.map((m,i)=>{const p=mProg(m),ok=p>=m.n,pc=Math.floor(p/m.n*100);return`<div class="panel sc mq ${m.c?"done":ok?"rdy":""}"><div class="mh"><b>${mTxt(m)}</b><span class="chip dif${m.t}">${["Fácil","Média","Difícil"][m.t]}</span></div>${bar7(p/m.n*100,f(p)+" / "+f(m.n)+" · "+pc+"%")}<div class="lab">Recompensa</div><div class="rwc">${rTxt(m.r)}</div><button class="btn ${ok&&!m.c?"g":""} wide" ${ok&&!m.c?"":"disabled"} onclick="claimM(${qT},${i})">${m.c?"✅ RECEBIDO":ok?"RESGATAR":"EM ANDAMENTO"}</button></div>`}).join("")}`};

+`<div class="seg2 s3">${[["Todos",TT.length],["🏅 Desbloqueados",un.length],["🔒 Bloqueados",lk.length]].map((x,k)=>`<button class="stb ${tFil==k?"on":""}" onclick="tFil=${k};render()"><b>${x[0]}</b><small>${x[1]}</small></button>`).join("")}</div>`

const PROF=()=>`<div class="seg2">${[["t","🏅 Títulos"],["a","🏆 Conquistas"]].map(x=>`<button class="stb ${pT==x[0]?"on":""}" onclick="pT='${x[0]}';render()"><b>${x[1]}</b></button>`).join("")}</div>${sec7("📈","Bônus ativos","Conquistas (permanentes) × Título equipado × Armadura equipada",`<div class="kg">${ST.map(s=>kp7(STN[s],"×"+bn(s).toFixed(2))).join("")}</div>`)}`+(pT=="t"?TL():AL());

kvs=a=>a.map(x=>`<div class="kv"><span>${x[0]}</span><b>${x[1]}</b></div>`).join(""),grp=(t,ks)=>`<div class="panel sc"><div class="gh">${t}</div>${kvs(ks.map(k=>[k,R[k]]))}</div>`,
pt=(k,e)=>{const a=tot7(k);return[e,"❤ "+f(a.hp)+" · ⚔ "+f(a.dm)]},
ci=i?cs(i):null,b=i&&bush(i.id);
return`<div class="panel sc">${stp7("📊","STATUS DO JOGADOR",esc(S.name)+" · "+(tt?"🏅 "+tt.n:"sem título"))}<div class="kg">${kp7("⚡ BPS",f(bps())+"/s","","big")}${kp7("🍀 Luck",luck().toFixed(2)+"x","","big")}${kp7("🪙 Busheiros",f(S.money))}${kp7("♻ Rebirth",S.reb,"×"+rebMult(S.reb).toFixed(2))}</div></div>`
+sec7(1,"Atributos e bônus","Total = Conquistas × Título × Armadura",`<div class="atl">${ST.map(s=>`<div class="at"><div class="ah"><span>${ic[s]} ${STN[s]}</span><b>×${bn(s).toFixed(2)}</b></div><div class="ab"><span>Conquistas ×${(1+ACHC[s]).toFixed(2)}</span><span>Título ×${(1+tb(s)).toFixed(2)}</span><span>Armadura ×${(1+arB(s)).toFixed(2)}</span></div></div>`).join("")}</div>`)
+`<div class="g2">`+sec7(2,"BPS","",kvs([["Bushes na Fazenda ("+eqN+"/8)",f(S.eq.reduce((s,id)=>s+(id&&S.inv[id]?bushBps(S.inv[id]):0),0))],["Upgrades · Rebirth · Poção","×"+moneyMult().toFixed(2)],["Bônus de atributo","×"+bn("bps").toFixed(2)],["Pet","×"+petMult().toFixed(2)],["<b>BPS total</b>","<b>"+f(bps())+"/s</b>"]]))
+sec7(3,"Luck","",kvs([["Base",1],["Rebirth","+"+rebLuck(S.reb).toFixed(2)],["Dado equipado","+"+(S.dEq>=0?DICE[S.dEq][2]:0)],["Upgrade","+"+(lvc("luck")*UP.luck[4]).toFixed(2)],["Poção de Luck",potA("luck")?"×2":"inativa"],["Bônus de atributo","×"+bn("luck").toFixed(2)],["Habilidades (Fazenda)","×"+abLuck().toFixed(2)],["<b>Luck total</b>","<b>"+luck().toFixed(2)+"x</b>"]]))
+sec7(4,"Vida e Dano","Somados dos times (com todos os bônus)",kvs([pt(S.eq.filter(Boolean),"Fazenda"),pt(S.team,"Time da Torre"),pt(S.wteam,"Time da Guerra"),["Bônus de Vida","×"+bn("hp").toFixed(2)],["Bônus de Dano","×"+bn("dmg").toFixed(2)]]))
+sec7(5,"XP","",kvs([["Bônus de XP","×"+bn("xp").toFixed(2)],["Poção de XP",potA("xp")?"ativa ×2":"inativa"],["Maior nível",R["Maior nível"]]]))+`</div>`
+sec7(6,"Bush selecionada","Escolha qualquer Bush do inventário.",l.length?`<select style="width:100%;margin:0 0 10px" onchange="stSel=this.value;render()">${l.map(x=>`<option value="${x.k}" ${x.k==stSel?"selected":""}>${S.eq.includes(x.k)?"⭐ ":""}${bush(x.id).name} · ${Q[x.q].n} · Lv${x.lv} · ${f(bushBps(x))} BPS</option>`).join("")}</select><div class="bsel rr ${RAR[b.rarity]}">${art7(i)}<div><b style="font-size:16px">${b.name}${i.evo?" ✦":""}</b><br><span class="rc s${b.sub||0} ${RAR[b.rarity]}">${RAR[b.rarity]} ${SUBN[b.sub||0]}</span> <span class="chip">${S.eq.includes(i.k)?"na Fazenda":"no inventário"}</span></div></div>${bar7(i.lv>=200?100:i.xp/xpNeed(i.lv)*100,i.lv>=200?"Lv 200 · MAX":"Lv "+i.lv+" · XP "+f(i.xp)+" / "+f(xpNeed(i.lv)))}<div class="kg">${kp7("⚡ BPS",f(bushBps(i)))}${kp7("❤ Vida",f(ci.hp))}${kp7("⚔ Dano",f(ci.dm))}${kp7("Qualidade",Q[i.q].n)}${kp7("💠 Gemas",(i.gem||0)+"/100")}${kp7("Tier",i.t>=0?TIERS[i.t].n+" ×"+TIERS[i.t].m:"—")}</div><div class="kv"><span>Mutações</span><b>${i.ms.map(k=>M[k].n).join(", ")||"nenhuma"}</b></div><div class="kv"><span>Habilidade</span><b>${i.ab&&AB[i.ab]?AB[i.ab].n+" · "+abTxt(i.ab):"nenhuma"}</b></div>`:'<div class="panel empty">Você ainda não tem Bushes.</div>')
+`<div class="secd">📈 Progresso e recordes</div><div class="g2">`+grp("💰 Economia",["Busheiros ganhos","Busheiros vendidos","Maior BPS (bush)","Maior multiplicador","Luck máxima"])+grp("🎮 Progresso",["Total Rolls","Rebirths","Maior nível","Tempo online","Golden/Diamond/Obsidian"])+grp("🌿 Coleção",["Bushes descobertos","Mutações descobertas","Melhor Bush"])+grp("🎯 Maiores sequências sem...",["Maior seq. sem Legendary","Maior seq. sem Mythic","Maior seq. sem Secret","Maior seq. sem Eternal","Maior seq. sem Divino"])+`</div><div class="panel sc"><div class="gh">🎲 Pulls por raridade</div><div class="chips" style="justify-content:flex-start">${RAR.map((n,k)=>`<span class="chip rc ${n}">${n}: ${S.rc[k]||0}</span>`).join("")}</div></div>`};

/* ===== INDEX: interface de coleção (somente apresentação; não altera lógica de Bushes/mutações) ===== */
let dxT="b",dxR=-1,dxF=0;
const dxHave=b=>S.bq[b.id]!==undefined,
 dxQi=id=>Math.max(0,Math.min(Q.length-1,S.bq[id]??3)),
 dxSub=b=>{const u=b.sub||0;return`${RAR[b.rarity]} ${SUBN[u]}${u>=3?" "+"★".repeat(u-2):""}${b.fused?" · Fundido":""}`},
 dxCls=x=>x.m>1?"up":x.m<1?"dn":"eq",
 dxPc=m=>+Math.abs((m-1)*100).toFixed(1),
 dxSample=()=>B.filter(dxHave).sort((a,b)=>b.rarity-a.rarity||b.baseBps-a.baseBps)[0]||B[0],
 dxSeg=(a,k,fn)=>`<div class="seg2 s3">${a.map((x,j)=>`<button class="stb ${k==j?"on":""}" onclick="${fn}(${j})"><b>${x[0]}</b><small>${x[1]}</small></button>`).join("")}</div>`;
function dxUp(){const e=$("#dx");if(!e)return;const r=e.querySelector(".dx-rar"),sl=r?r.scrollLeft:0;e.innerHTML=DXH();const n=e.querySelector(".dx-rar");if(n){n.scrollLeft=sl;const a=n.querySelector(".on");if(a)n.scrollLeft=Math.max(0,a.offsetLeft-(n.clientWidth-a.offsetWidth)/2)}}
function dxGo(t){dxT=t;dxF=0;dxUp()}
function dxRar(r){dxR=r;dxUp()}
function dxFil(f){dxF=f;dxUp()}
function DXH(){const nb=B.filter(dxHave).length,nm=M.filter(x=>S.muts[x.n]).length;
 return`<div class="dx-h"><h2>📚 INDEX</h2><small>Toque para ver detalhes</small></div>
<div class="dx-main">${[["b","🌿","Bushes",nb+"/"+B.length],["m","🧬","Mutações",nm+"/"+M.length]].map(t=>`<button class="stb ${dxT==t[0]?"on":""}" onclick="dxGo('${t[0]}')"><i>${t[1]}</i><b>${t[2]}</b><small>${t[3]} descobertas</small></button>`).join("")}</div>${dxT=="b"?DXB(nb):DXM(nm)}`}
function dxCard(b,fused){const q=dxQi(b.id),u=b.sub||0;
 return`<div class="card bc rr ${RAR[b.rarity]}" role="button" tabindex="0" onclick="dxBush('${b.id}')" onkeydown="if(event.key=='Enter')dxBush('${b.id}')">${S.bevo[b.id]?'<span class="dx-bd" title="Evoluído">✦</span>':""}
<div class="art"><div class="bush">${bi(b)}</div></div><b class="bc-n">${b.name}</b>
<div class="rc s${u} ${RAR[b.rarity]} bc-r">${dxSub(b)}</div>
<div class="bc-bps">${f(fused?b.baseBps:(S.bb[b.id]||0))} <small>${fused?"BPS BASE":"BPS MÁX"}</small></div>
${!fused&&S.bq[b.id]!==undefined?`<div class="bc-chips"><span class="chip ql" style="--qh:${q*28}" title="Melhor qualidade">${Q[q].n}</span></div>`:""}</div>`}
function DXB(nb){const fl=Object.values(S.cust).sort((a,b)=>b.baseBps-a.baseBps),
 rl=RAR.map((n,r)=>{const l=B.filter(b=>b.rarity==r);return{n,r,t:l.length,d:l.filter(dxHave).length}}),
 chips=`<div class="dx-rar">`+[`<button class="dx-rc ${dxR==-1?"on":""}" onclick="dxRar(-1)"><b>📋 Resumo</b><small>${nb}/${B.length}</small></button>`].concat(rl.map(x=>`<button class="dx-rc ${x.n} ${dxR==x.r?"on":""}${x.t&&x.d==x.t?" done":""}" onclick="dxRar(${x.r})"><b>${x.n}</b><small>${x.d}/${x.t}</small></button>`),[`<button class="dx-rc ${dxR==99?"on":""}" onclick="dxRar(99)"><b>🧬 Fundidos</b><small>${fl.length}</small></button>`]).join("")+`</div>`;
 let body;
 if(dxR==-1){body=`<div class="dx-tot"><div class="row2"><span>Progresso total</span><b>${nb} / ${B.length}</b></div><div class="bar"><i style="width:${B.length?nb/B.length*100:0}%"></i></div></div>
<div class="dx-ov">${rl.map(x=>`<button class="dx-or ${x.n}" onclick="dxRar(${x.r})"><div class="dx-on"><b class="rc">${x.n}</b><div class="bar"><i style="width:${x.t?x.d/x.t*100:0}%"></i></div></div><span class="dx-n">${x.d}/${x.t}</span><span class="dx-go">›</span></button>`).join("")}<button class="dx-or" onclick="dxRar(99)"><div class="dx-on"><b>🧬 Bushes Fundidos</b></div><span class="dx-n">${fl.length}</span><span class="dx-go">›</span></button></div>`}
 else if(dxR==99){body=`<div class="dx-sh"><h3>🧬 Bushes Fundidos</h3><small>${fl.length} criados</small></div>${fl.length?`<div class="grid bgrid">${fl.map(b=>dxCard(b,1)).join("")}</div>`:'<div class="panel empty">Nenhum Bush fundido ainda.</div>'}`}
 else{const r=dxR,l=B.filter(b=>b.rarity==r).sort((a,b)=>a.sub-b.sub||b.baseBps-a.baseBps),un=l.filter(dxHave),lk=l.filter(b=>!dxHave(b));
  body=`<div class="dx-sh ${RAR[r]}"><h3 class="rc">${RAR[r]}</h3><small>${un.length} / ${l.length} descobertas</small></div><div class="bar ${RAR[r]}"><i style="width:${l.length?un.length/l.length*100:0}%"></i></div>
${dxSeg([["Todas",l.length],["✅ Descobertas",un.length],["🔒 Bloqueadas",lk.length]],dxF,"dxFil")}
${dxF!=2?`<div class="dx-sec">✅ Descobertas (${un.length})</div>${un.length?`<div class="grid bgrid">${un.map(b=>dxCard(b)).join("")}</div>`:'<div class="panel empty">Nenhuma descoberta ainda.</div>'}`:""}
${dxF!=1?`<div class="dx-sec">🔒 Bloqueadas (${lk.length})</div>${lk.length?`<div class="dx-lg">${lk.map(()=>'<div class="dx-lk" title="Ainda não descoberta"><i>🔒</i><b>???</b></div>').join("")}</div>`:'<div class="panel empty">Tudo descoberto! 🎉</div>'}`:""}`}
 return chips+body}
function DXM(nm){const smp=dxSample(),l=M.map((x,k)=>({x,k})).sort((a,b)=>b.x.c-a.x.c),un=l.filter(o=>S.muts[o.x.n]),lk=l.filter(o=>!S.muts[o.x.n]);
 return`<div class="dx-tot"><div class="row2"><span>Progresso total</span><b>${nm} / ${M.length}</b></div><div class="bar"><i style="width:${M.length?nm/M.length*100:0}%"></i></div></div>

 const h=c.b.map(i=>trBi(i,c.c,x("b",i.k))).concat(c.a.map(a=>trAr(a,x("a",a.k))),Object.keys(c.r).map(id=>trIt(trMeta(id),c.r[id],"",x("r",id))));return h.join("")||'<div class="trem">Nada oferecido</div>'}
function trPick(){const q=TR.q.toLowerCase(),tab=(k,l)=>`<button class="chipb ${TR.pick==k?"on":""}" onclick="TR.pick='${k}';trUi(1)">${l}</button>`;let h="";
 if(TR.pick=="b")h=Object.values(S.inv).filter(i=>!S.lock[i.k]&&(!q||bush(i.id).name.toLowerCase().includes(q))).sort(SORT[0]).slice(0,60).map(i=>trBi(i,{},`<button class="btn g" onclick="trPut('b','${i.k}')">+</button>`)).join("")||'<div class="trem">Nenhuma Bush disponível (🔒 bloqueadas não aparecem)</div>';
 else if(TR.pick=="a")h=Object.values(S.ar).map(a=>trAr(a,`<button class="btn g" onclick="trPut('a','${a.k}')">+</button>`)).join("")||'<div class="trem">Sem armaduras</div>';
 else h=trStacks().filter(id=>(TR.pick=="p")==id.startsWith("pet:")).map(id=>({id,have:trGet(id)+((S.trE&&S.trE.r[id])||0)})).filter(x=>x.have>0).map(x=>{const cur=(S.trE&&S.trE.r[x.id])||0;return trIt(trMeta(x.id),0,"Você tem "+x.have,`<input id="tq_${x.id.replace(":","_")}" type="number" min="0" max="${x.have}" value="${cur||1}" inputmode="numeric"><button class="btn g" onclick="trPut('r','${x.id}',document.getElementById('tq_${x.id.replace(":","_")}').value)">Oferecer</button>`)}).join("")||'<div class="trem">Nada disponível</div>';
 return`<div class="trpk"><div class="chips">${tab("b","🌿 Bushes")}${tab("a","🛡 Armaduras")}${tab("i","🧪 Itens")}${tab("p","🐾 Pets")}</div>${TR.pick=="b"?`<input class="fs" placeholder="🔍 Buscar nome" value="${TR.q.replace(/"/g,"")}" onchange="TR.q=this.value;trUi(1)">`:""}<div class="trl">${h}</div></div>`}
function trWin(t){const open=t.st=="open",cnt=t.st=="counting",sync=trSig(trOff())==trSig(t.mine),both=trSig(trOff())!=trSig({}),can=open&&sync&&!t.mok&&(both||trSig(trIn(t.th)||{})!=trSig({}));
 const st=cnt?`<div id="trcd" class="trcd on"></div>`:`<div class="trcd">${t.mok&&t.tok?"":t.mok?"✔ Você aceitou · aguardando o outro jogador":t.tok?"✔ O outro jogador aceitou · confira e aceite":!sync?"Sincronizando oferta…":"Monte a troca e toque em Aceitar"}</div>`,
 hd=(av,n,l,ok)=>`<header><span class="avatar sm">${av}</span><div><b>${n}</b><small>${l}</small></div>${ok?'<i class="ok">✔ Aceitou</i>':""}</header>`;
 return`<div class="trbox"><button class="bd-x" onclick="trClose()" aria-label="Minimizar">▾</button><h2>🤝 TRADE</h2>${st}<div class="trcols"><section class="trs me">${hd(avHtml(),esc(S.name)||"Você","VOCÊ → oferece",t.mok)}<div class="trl">${trSide(t,1)}</div></section><section class="trs th">${hd(lbAv(t.oa),lbName(t.on),"OUTRO JOGADOR → oferece",t.tok)}<div class="trl">${trSide(t,0)}</div></section></div>${open?trPick():""}<div class="trbt"><button class="btn g" ${can?"":"disabled"} onclick="trAcc()">✅ Aceitar</button><button class="btn r" onclick="trCancel()">❌ ${cnt?"Cancelar Trade":"Negar / Cancelar"}</button></div><small>Mudar a oferta cancela os aceites. A troca é validada pelo servidor.</small></div>`}
const trInbox=()=>`<div class="trbox"><button class="bd-x" onclick="trClose()" aria-label="Fechar">✕</button><h2>📨 Solicitações de Trade</h2>${TR.in.map(q=>`<div class="row trq"><span class="avatar sm">${lbAv(q.av)}</span><b>${lbName(q.name)}</b><span class="trqb"><button class="btn g" onclick="trAnswer(${q.id},true)">Aceitar</button><button class="btn r" onclick="trAnswer(${q.id},false)">Negar</button></span></div>`).join("")||'<div class="trem">Nenhuma solicitação no momento.</div>'}<small>Para enviar: Ranking → toque em um jogador → 🤝 Enviar Trade.</small></div>`;
function trUi(force){const w=$("#trw"),fb=$("#trf");if(!w)return;const t=TR.tr,n=TR.in.length;fb.style.display=S.trR?"flex":"none";fb.innerHTML="🤝"+(t?"<b>●</b>":n?"<b>"+n+"</b>":"");
 if(!TR.ui){w.style.display="none";return}w.style.display="flex";const sg=JSON.stringify([TR.op,t&&[t.id,t.st,t.ver,t.mok,t.tok,trSig(t.mine),trSig(t.th||{})],S.trE&&trSig(trOff()),TR.in.map(q=>q.id),TR.pick]);if(!force&&sg==TR.sg)return;TR.sg=sg;try{w.innerHTML=t?trWin(t):TR.op?`<div class="trbox"><h2>🤝 TRADE</h2><div class="trem">⏳ Abrindo Trade…</div></div>`:trInbox()}catch(e){console.error("Trade UI:",e);w.innerHTML='<div class="trbox"><h2>🤝 TRADE</h2><div class="trem">Erro ao montar a tela. Toque em Cancelar.</div><div class="trbt"><button class="btn r" onclick="trCancel()">❌ Cancelar</button></div></div>'}if(t&&t.st=="counting")trTick()}
document.body.insertAdjacentHTML("beforeend",'<button id="trf" onclick="TR.ui=true;trUi(1)" aria-label="Trade"></button><div id="trw" onclick="if(event.target===this)trClose()"></div>');
setInterval(()=>{if(!LB.url||!S.trR)return;const a=TR.tr||TR.ui||Date.now()<(TR.fast||0);if(document.hidden&&!TR.tr)return;if(Date.now()-TR.lp>=(TR.tr?1000:a?1500:6000)){TR.lp=Date.now();trPoll()}},500);setInterval(trTick,250);
if(LB.url&&S.pid&&S.name)trReg().then(()=>trPoll()).catch(()=>{});else trUi();

const INVHDR=()=>INVHDR0()+trInvNote();
render();
